# Runs the test suite on every pull request and every push to main,
# on Windows, Mac and Linux.
#
# Faith without works is dead (James 2:26). A test suite nobody runs
# is not doing much better.

name: tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run it just made pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every combination finish, so one red box does not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # tests/test_web_engine.py runs web/engine.js through Node,
      # so the browser version's rules get checked here too.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install what the game needs
        run: python -m pip install -r requirements.txt

      # tests/test_web.py is left out on purpose. It needs a real browser and it
      # tests the published site instead of this copy of the code, so it cannot
      # tell us anything about a pull request (see BACKLOG.md).
      - name: Run the tests
        run: python -m pytest --ignore tests/test_web.py
